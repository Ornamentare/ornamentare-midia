<script>
(function(){
  var WA='551732015400';
  function link(msg){return 'https://wa.me/'+WA+'?text='+encodeURIComponent(msg)}
  function fix(){
    document.querySelectorAll('#grid .cd2').forEach(function(c){
      var b=c.querySelector('button.rs'); if(!b) return;
      var nome=(c.querySelector('h3')||{}).textContent||'';
      var mt=(c.querySelector('.mt')||{}).textContent||'';
      var pr=(c.querySelector('.px b')||{}).textContent||'';
      var a=document.createElement('a');
      a.className=b.className; a.textContent='Reservar no WhatsApp'; a.target='_blank'; a.rel='noopener';
      a.href=link('Olá! Quero reservar o porcelanato '+nome.trim()+' ('+mt.trim()+') por '+pr.trim()+'/m² no Pix. Pode confirmar o estoque?');
      a.addEventListener('click',function(){try{gtag('event','generate_lead',{event_category:'whatsapp',event_label:'card '+nome.trim()})}catch(e){}});
      b.parentNode.replaceChild(a,b);
    });
  }
  var g=document.getElementById('grid');
  if(g){ new MutationObserver(fix).observe(g,{childList:true}); }
  fix(); setTimeout(fix,1500); setTimeout(fix,4000);
})();
</script>
